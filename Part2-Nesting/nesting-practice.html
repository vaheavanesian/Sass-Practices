<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="/assets/css/nesting-practice.css">
</head>

<body>

    <div class="login-container">
        <div class="login-content">

            <h1>Sign In</h1>

            <p class="register-text">
                New user? <a href="#">Create an account</a>
            </p>

            <form>

                <div class="input-group">
                    <input type="email" placeholder="Email Address" required>

                    <input type="password" placeholder="Password" required>
                </div>

                <div class="form-actions">
                    <a href="#" class="forgot-password">
                        Forgot Password
                    </a>

                    <button type="submit" class="sign-in-btn">
                        Sign in
                    </button>
                </div>

            </form>

            <div class="divider">
                <span>Or</span>
            </div>

            <div class="social-buttons">

                <button class="social-btn" type="button">
                    <span class="social-icon google-icon">G</span>
                    <span>Sign With Google</span>
                </button>

                <button class="social-btn" type="button">
                    <span class="social-icon facebook-icon">f</span>
                    <span>Sign In With Facebook</span>
                </button>

                <button class="social-btn" type="button">
                    <span class="social-icon apple-icon">
                        <svg viewBox="0 0 24 24">
                            <path
                                d="M16.6 12.8c0-2.2 1.8-3.2 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.4.8s-1.7-.8-2.8-.8c-1.5 0-2.9.9-3.7 2.2-1.6 2.8-.4 7 1.1 9.3.7 1.1 1.5 2.3 2.6 2.2 1-.1 1.4-.7 2.7-.7s1.7.7 2.8.7c1.2 0 1.9-1.1 2.6-2.2.8-1.3 1.1-2.5 1.1-2.6-.1 0-1.7-.7-1.7-3.9zM14.3 6.2c.6-.7 1-1.7.9-2.7-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.7-.9 2.6 1 .1 2-.5 2.6-1.2z" />
                        </svg>
                    </span>
                    <span>Sign In With Apple</span>
                </button>

            </div>

        </div>
    </div>

</body>

</html>
