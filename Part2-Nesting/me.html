<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: Arial, Helvetica, sans-serif;
        background: #F1F5F9;
        color: #000;
        min-height: 100vh;
        padding: 64px;
    }

    @media screen and (max-width: 480px) {
        body {
            padding: 32px;
        }
    }

    .login-container {
        background: #fff;
        max-width: 650px;
        min-height: calc(100vh - 128px);
        border-radius: 8px;
        margin: 0 auto;
        padding: 64px 9%;
    }

    @media screen and (max-width: 480px) {
        .login-container {
        min-height: calc(100vh - 64px);                
            }
    }

    .login-content {
        width: 100%;
        /* max-width: 650px; */
    }

    
</style>

<body>
    <div class="login-container">
        <div class="login-content">
            <h1>Sign In</h1>
        </div>
    </div>
</body>

</html>
